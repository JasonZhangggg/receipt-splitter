name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests skip CI. Agents push revisions as drafts, and marking the PR ready runs the full suite once.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # main requires this check, so a docs-only pull request still reports it, after skipping the gates.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # DIAG (do not merge): only the flaky WebKit sheet test, 25 times, never stopping at the first failure.
      - run: npm ci
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps webkit
      - continue-on-error: true
        run: npx playwright test e2e/sheet.spec.ts --project=mobile-safari -g "a flick down on the pick sheet" --repeat-each=25 --reporter=line
