name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # The branch filter matches the head branch name, so a pull request branch named main
    # also triggers this workflow. The event check keeps those runs from deploying.
    # A job-level `if` sees repository variables only, so set the site key at repository level.
    if: >-
      vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY != '' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
      # `vars` lists variable names. The action reads each value from this step's env
      # and passes it to `wrangler deploy` as `--var NAME:value`. It fails if a value is empty.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          vars: |
            ALLOWED_HOSTNAMES
        env:
          ALLOWED_HOSTNAMES: ${{ vars.ALLOWED_HOSTNAMES }}
