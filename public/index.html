<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <title>%WEB_TITLE%</title>
    <!-- The appearance this device picked (src/ui/appearance.ts) goes on before the first paint, since the bundle runs only after it. -->
    <script>
      (function () {
        try {
          var picked = localStorage.getItem("receipt-splitter:appearance");
          if (picked !== "light" && picked !== "dark") return;
          document.documentElement.setAttribute("data-theme", picked);
          var color = document.querySelector('meta[name="theme-color"][media*="' + picked + '"]').content;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = color; });
        } catch (error) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SplitWith" />
    <!-- Geist starts downloading while the bundle does; the fallback faces and the rest of the CSS come from src/ui/document.ts. The URLs match src/ui/fonts.generated.ts (src/ui/boot.test.ts checks). -->
    <link rel="preload" href="/fonts/geist-400-89ade87fce.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-500-1e5e5e4514.woff2" as="font" type="font/woff2" crossorigin />
    <style id="rs-faces">
      @font-face { font-family: "Geist"; font-weight: 400; font-display: swap; src: url("/fonts/geist-400-89ade87fce.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 500; font-display: swap; src: url("/fonts/geist-500-1e5e5e4514.woff2") format("woff2"); }
    </style>
    <!-- The loader (decision 27 in docs/design/b2/README.md) covers the first load until the app has mounted and Geist has loaded, so the page never paints in the fallback face. data-boot is "wait", then "leave" while it fades, then gone. The Split page also uses it while its link connects (see useBusyLoader in src/ui/document.ts): the app says "splitwith:busy" and "splitwith:idle", and data-boot is "busy" while the loader stays up over a visible page. A cold load that is still connecting when the app and Geist are ready goes from "wait" to "busy" without a fade, so the same drawing carries on. Without this script nothing is hidden. If the app never says it mounted, the CSS below shows the page at 8 s and the timer below makes it usable. The 300 ms and 8 s here match the CSS delays. -->
    <script>
      (function () {
        var t0 = performance.now();
        var html = document.documentElement;
        var mounted = false;
        var fonts = false;
        var busy = false;
        var booting = true;
        var since = t0;
        var timers = [];
        html.setAttribute("data-boot", "wait");
        function usable() {
          var root = document.getElementById("root");
          if (root) {
            root.removeAttribute("inert");
            root.removeAttribute("aria-busy");
          }
        }
        function later(fn, ms) {
          timers.push(setTimeout(fn, ms));
        }
        function lift(age) {
          function gone() {
            html.removeAttribute("data-boot");
          }
          if (age < 300) {
            usable();
            return gone();
          }
          later(function () {
            usable();
            html.setAttribute("data-boot", "leave");
            later(gone, 200);
          }, Math.max(0, 600 - age));
        }
        function ready() {
          if (!booting || !mounted || !fonts) return;
          booting = false;
          var age = performance.now() - t0;
          // Past 8 s the CSS has already shown the page and faded the loader, so nothing on screen may change.
          if (age >= 8000) {
            usable();
            return html.removeAttribute("data-boot");
          }
          if (busy) {
            usable();
            return html.setAttribute("data-boot", "busy");
          }
          lift(age);
        }
        function switched(now) {
          if (busy === now) return;
          busy = now;
          if (booting) return;
          timers.forEach(clearTimeout);
          timers = [];
          if (busy) {
            since = performance.now();
            return html.setAttribute("data-boot", "busy");
          }
          if (html.getAttribute("data-boot") === "busy") lift(performance.now() - since);
        }
        document.addEventListener("splitwith:mounted", function () {
          mounted = true;
          ready();
        });
        document.addEventListener("splitwith:busy", function () {
          switched(true);
        });
        document.addEventListener("splitwith:idle", function () {
          switched(false);
        });
        setTimeout(usable, 8000);
        function fontsIn() {
          fonts = true;
          ready();
        }
        setTimeout(fontsIn, Math.max(0, 3000 - performance.now()));
        try {
          Promise.all([document.fonts.load('400 16px "Geist"'), document.fonts.load('500 16px "Geist"')]).then(fontsIn, fontsIn);
        } catch (error) {
          fontsIn();
        }
      })();
    </script>
    <style id="rs-boot-style">
      #rs-boot { display: none; }
      [data-boot] #rs-boot { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; color: #171717; opacity: 0; animation: rs-boot-in 200ms cubic-bezier(.23,1,.32,1) 300ms forwards, rs-boot-out 200ms cubic-bezier(.23,1,.32,1) 8s forwards; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #rs-boot { color: #EDEDED; } }
      :root[data-theme="dark"] #rs-boot { color: #EDEDED; }
      /* Its own keyframes name: reusing rs-boot-out from the 8 s fallback above would update that animation, which started at load and has long finished. */
      [data-boot="leave"] #rs-boot { animation: rs-boot-leave 200ms cubic-bezier(.23,1,.32,1) forwards; }
      /* Over a page that is already showing, with no 8 s fallback. Its first animation matches the one above, so a cold load that goes from "wait" to "busy" keeps fading in rather than starting over. */
      [data-boot="busy"] #rs-boot { animation: rs-boot-in 200ms cubic-bezier(.23,1,.32,1) 300ms forwards; }
      #root { transition: opacity 260ms cubic-bezier(.23,1,.32,1); }
      /* 0.001 rather than 0, which looks the same: Chrome reports no first contentful paint for a page that fades up from 0, and the OCR prefetch waits for that paint. */
      [data-boot="wait"] #root { opacity: 0.001; animation: rs-boot-in 260ms cubic-bezier(.23,1,.32,1) 8s forwards; }
      /* Each line is its own copy of the receipt's SVG, clipped to the line's length and slid through it, since a transform keeps animating while the bundle holds the main thread and a stroke-dashoffset does not. --x and --w are in viewBox units. */
      #rs-boot .paper { --u: calc(72px / 61); position: relative; width: 52px; height: 72px; animation: rs-boot-feed 2.4s cubic-bezier(.65,0,.35,1) 300ms infinite; }
      #rs-boot svg { display: block; }
      #rs-boot i { position: absolute; top: 0; left: calc(var(--x) * var(--u)); width: calc(var(--w) * var(--u)); height: 72px; overflow: hidden; }
      #rs-boot i svg { position: absolute; top: 0; left: calc(var(--x) * var(--u) * -1); stroke: currentColor; stroke-width: 1.5; transform: translateX(calc(var(--w) * var(--u) * -1 - 1px)); animation: rs-boot-draw 2.4s cubic-bezier(.65,0,.35,1) infinite; }
      #rs-boot i:nth-of-type(1) svg { animation-delay: 300ms; }
      #rs-boot i:nth-of-type(2) svg { animation-delay: 420ms; }
      #rs-boot i:nth-of-type(3) svg { animation-delay: 540ms; }
      #rs-boot i:nth-of-type(4) svg { animation-delay: 720ms; stroke-width: 2.25; }
      @keyframes rs-boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rs-boot-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes rs-boot-leave { from { opacity: 1; } to { opacity: 0; } }
      @keyframes rs-boot-draw { 0% { transform: translateX(calc(var(--w) * var(--u) * -1 - 1px)); } 22%, 78% { transform: none; } 92%, 100% { transform: translateX(calc(var(--w) * var(--u) + 1px)); } }
      @keyframes rs-boot-feed { 0%, 100% { transform: translateY(-3px); } 30%, 85% { transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #rs-boot .paper, #rs-boot i svg { animation: none; transform: none; }
      }
    </style>
    <style id="rs-ground">
      :root { color-scheme: light dark; }
      /* Double-tap zoom is off for the whole page, so a quick second tap on text never zooms. Pinch stays. */
      html { touch-action: manipulation; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      html, body { background-color: #FCFCFC; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #111111; } }
      :root[data-theme="light"], :root[data-theme="light"] body { background-color: #FCFCFC; }
      :root[data-theme="dark"], :root[data-theme="dark"] body { background-color: #111111; }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="rs-boot" role="status" aria-label="Loading">
      <div class="paper">
        <svg width="52" height="72" viewBox="0 -4 44 61" fill="none" aria-hidden="true">
          <path d="M4 2H40V50l-3 3-3-3-3 3-3-3-3 3-3-3-3 3-3-3-3 3-3-3-3 3-3-3V2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <i style="--x: 11; --w: 22"><svg width="52" height="72" viewBox="0 -4 44 61" aria-hidden="true"><line x1="11" y1="14" x2="33" y2="14" /></svg></i>
        <i style="--x: 11; --w: 16"><svg width="52" height="72" viewBox="0 -4 44 61" aria-hidden="true"><line x1="11" y1="21" x2="27" y2="21" /></svg></i>
        <i style="--x: 11; --w: 19"><svg width="52" height="72" viewBox="0 -4 44 61" aria-hidden="true"><line x1="11" y1="28" x2="30" y2="28" /></svg></i>
        <i style="--x: 21; --w: 12"><svg width="52" height="72" viewBox="0 -4 44 61" aria-hidden="true"><line x1="21" y1="39" x2="33" y2="39" /></svg></i>
      </div>
    </div>
    <div id="root"></div>
    <script>
      if (document.documentElement.getAttribute("data-boot") === "wait") {
        document.getElementById("root").setAttribute("inert", "");
        document.getElementById("root").setAttribute("aria-busy", "true");
      }
    </script>
  </body>
</html>
