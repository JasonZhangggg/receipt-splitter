<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)" />
    <title>%WEB_TITLE%</title>
    <!-- The appearance this device picked (src/ui/appearance.ts) goes on before the first paint, since the bundle runs only after it. -->
    <script>
      (function () {
        try {
          var picked = localStorage.getItem("receipt-splitter:appearance");
          if (picked !== "light" && picked !== "dark") return;
          document.documentElement.setAttribute("data-theme", picked);
          var color = document.querySelector('meta[name="theme-color"][media*="' + picked + '"]').content;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = color; });
        } catch (error) {}
      })();
    </script>
    <style id="rs-ground">
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      html, body { background-color: #FFFFFF; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #121315; } }
      :root[data-theme="light"], :root[data-theme="light"] body { background-color: #FFFFFF; }
      :root[data-theme="dark"], :root[data-theme="dark"] body { background-color: #121315; }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
