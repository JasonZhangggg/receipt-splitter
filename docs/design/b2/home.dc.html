<style>

    const k = root.offsetWidth / box.width;
    if (document.startViewTransition) {
      const cx = b.left + b.width / 2;
      const cy = b.top + b.height / 2;
      const r = Math.hypot(Math.max(cx, window.innerWidth - cx), Math.max(cy, window.innerHeight - cy));
      const flip = () => new Promise((done) => { this.setState({ ...this.st(), dark: next, iconDark: next, wipe: null }, done); setTimeout(done, 120); });
      document.startViewTransition(flip).ready.then(() => {
        document.documentElement.animate(
          { clipPath: ['circle(0px at ' + cx + 'px ' + cy + 'px)', 'circle(' + r + 'px at ' + cx + 'px ' + cy + 'px)'] },
          { duration: 600, easing: 'cubic-bezier(.32,.72,0,1)', pseudoElement: '::view-transition-new(root)' },
        );
      }).catch(() => {});
      return;
    }
    clearTimeout(this.wipeIn); clearTimeout(this.wipeOut);
    this.set({ iconDark: next, wipe: { x: Math.round((b.left + b.width / 2 - box.left) * k), y: Math.round((b.top + b.height / 2 - box.top) * k), color: next ? '#111111' : '#fcfcfc', out: false } });
    this.wipeIn = setTimeout(() => {
      this.set({ dark: next, wipe: { ...this.st().wipe, out: true } });
      this.wipeOut = setTimeout(() => this.set({ wipe: null }), 240);
    }, 560);
  }
  st() {
    if (this.state && this.state.ready) return this.state;
    return { ready: true, phase: this.props.start || 'empty', step: 0, handles: [{ app: 'venmo', value: '' }], names: [], addingName: false, draft: '', nameError: '', tried: false };
  }
  set(patch) { this.setState({ ...this.st(), ...patch }); }
  componentWillUnmount() { clearTimeout(this.timer); }
  startReading() {
    clearTimeout(this.timer);
    this.set({ phase: 'reading', step: 0 });
    const tick = (step) => {
      this.timer = setTimeout(() => {
        if (step < 2) { this.set({ step: step + 1 }); tick(step + 1); } else this.set({ phase: 'ready' });
      }, 900);
    };
    tick(0);
  }
  addName(keepOpen) {
    const s = this.st();
    const name = s.draft.trim();
    if (!name) { this.set({ addingName: keepOpen && s.addingName, nameError: '' }); return; }
    if (s.names.some((n) => n.toLowerCase() === name.toLowerCase())) { this.set({ nameError: 'That name is already here.' }); return; }
    this.set({ names: [...s.names, name.slice(0, 40)], draft: '', nameError: '', addingName: !!keepOpen });
  }
  componentDidUpdate() {
    if (this.st().addingName && !this.focused) {
      this.focused = true;
      const input = document.querySelector('.h-inline input');
      if (input) input.focus();
    }
    if (!this.st().addingName) this.focused = false;
  }
  renderVals() {
    const s = this.st();
    const used = s.handles.map((h) => h.app);
    const handles = s.handles.map((h, i) => {
      const app = APPS.find((a) => a.id === h.app);
      return {
        apps: APPS.filter((a) => a.id === h.app || !used.includes(a.id)).map((a) => ({ id: a.id, label: a.label, on: a.id === h.app })),
        app: h.app, fieldLabel: app.field, placeholder: app.placeholder, value: h.value,
        removable: i > 0, removeLabel: 'Remove ' + app.label,
        onApp: (e) => { const v = e.target.value; this.set({ handles: this.st().handles.map((x, j) => (j === i ? { app: v, value: '' } : x)) }); },
        onValue: (e) => { const v = e.target.value; this.set({ handles: this.st().handles.map((x, j) => (j === i ? { ...x, value: v } : x)) }); },
        remove: () => this.set({ handles: this.st().handles.filter((x, j) => j !== i) }),
      };
    });
    let reason = '';
    if (s.phase === 'empty') reason = 'Add a receipt first.';
    else if (s.phase === 'reading') reason = 'Reading…';
    else if (!s.names.length) reason = 'Add your name first.';
    else if (s.created) reason = 'Link created.';
    else reason = '';
    const blocked = s.phase !== 'ready' || !s.names.length;
    return {
      theme: this.isDark() ? 'dark' : 'light',
      toggleTheme: (e) => this.toggleTheme(e),
      iconDarkAttr: String(this.st().wipe ? !!this.st().iconDark : this.isDark()),
      themeLabel: this.isDark() ? 'Switch to light mode' : 'Switch to dark mode',
      wipeOn: !!this.st().wipe,
      wipeOutAttr: String(!!(this.st().wipe && this.st().wipe.out)),
      wipeX: this.st().wipe ? this.st().wipe.x : 0,
      wipeY: this.st().wipe ? this.st().wipe.y : 0,
      wipeColor: this.st().wipe ? this.st().wipe.color : 'transparent',
      isEmpty: s.phase === 'empty', isReading: s.phase === 'reading', isReady: s.phase === 'ready',
      stage: STAGES[s.step], progress: [30, 60, 85][s.step] + '%',
      startReading: () => this.startReading(),
      replace: () => this.set({ phase: 'empty' }),
      handles,
      canAddHandle: s.handles.length < APPS.length,
      addHandle: () => { const free = APPS.find((a) => !this.st().handles.some((h) => h.app === a.id)); if (free) this.set({ handles: [...this.st().handles, { app: free.id, value: '' }] }); },
      names: s.names.map((name, i) => ({ name, isYou: i === 0, removeLabel: 'Remove ' + name, remove: () => this.set({ names: this.st().names.filter((n) => n !== name) }) })),
      namesHint: s.names.length ? 'Others can add themselves' : 'Start with your name',
      addingName: !!s.addingName, notAddingName: !s.addingName,
      addNameLabel: s.names.length ? 'Add name' : 'Add your name',
      draftPlaceholder: s.names.length ? 'Name' : 'Your name',
      openName: () => this.set({ addingName: true, nameError: '' }),
      onDraftBlur: () => this.addName(false),
      draft: s.draft, onDraft: (e) => { const v = e.target.value; this.set({ draft: v, nameError: '' }); },
      onDraftKey: (e) => { if (e.key === 'Enter') this.addName(true); if (e.key === 'Escape') this.set({ addingName: false, draft: '' }); },
      nameError: s.nameError,
      reason,
      blocked, offAttr: String(blocked), warnAttr: String(blocked && s.tried),
      create: () => { if (blocked) { this.set({ tried: true }); return; } this.set({ created: true }); },
    };
  }
}
</script>
